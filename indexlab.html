<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Theme & Brand Block #003</title>
  <link rel="stylesheet" href="block.css">
</head>
<body>
  <main class="block-shell">
    <header class="block-header">
      <div><div class="eyebrow">Shia App Factory</div><h1>Theme & Brand Block #003</h1></div>
      <div class="status">v0.1.0 · Workbench</div>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="editor-title">
        <h2 id="editor-title">Theme configuration</h2>
        <form id="theme-form" novalidate>
          <div class="form-grid">
            <div class="field full"><label for="brand-name">Brand name</label><input id="brand-name" maxlength="60" required></div>
            <div class="field full"><label for="logo-url">Logo URL</label><input id="logo-url" type="url" placeholder="https://…"></div>
            <div class="field"><label for="primary-color">Primary color</label><div class="color-row"><input id="primary-picker" type="color"><input id="primary-color" pattern="#[0-9A-Fa-f]{6}"></div></div>
            <div class="field"><label for="secondary-color">Secondary color</label><div class="color-row"><input id="secondary-picker" type="color"><input id="secondary-color" pattern="#[0-9A-Fa-f]{6}"></div></div>
            <div class="field"><label for="font-family">Font family</label><select id="font-family"><option value="Inter, system-ui, sans-serif">Inter / System</option><option value="Georgia, serif">Georgia</option><option value="Arial, sans-serif">Arial</option><option value="'Trebuchet MS', sans-serif">Trebuchet</option></select></div>
            <div class="field"><label for="heading-weight">Heading weight</label><select id="heading-weight"><option>500</option><option>600</option><option selected>700</option><option>800</option></select></div>
            <div class="field"><label for="radius">Border radius</label><select id="radius"><option value="0px">Square</option><option value="6px">Small</option><option value="12px" selected>Medium</option><option value="18px">Large</option><option value="999px">Pill</option></select></div>
            <div class="field"><label for="button-style">Button style</label><select id="button-style"><option value="solid">Solid</option><option value="outline">Outline</option><option value="soft">Soft</option></select></div>
            <div class="field"><label for="density">Density</label><select id="density"><option value="compact">Compact</option><option value="comfortable" selected>Comfortable</option><option value="spacious">Spacious</option></select></div>
          </div>
          <div class="actions"><button class="primary" type="submit">Apply theme</button><button class="secondary" id="reset-button" type="button">Reset</button></div>
        </form>
        <div id="console" class="console" role="status" aria-live="polite">Ready.</div>
      </section>

      <section class="panel" aria-labelledby="preview-title">
        <h2 id="preview-title">Live preview</h2>
        <div class="preview">
          <div class="preview-bar"><img id="preview-logo" class="preview-logo" alt=""><strong id="preview-name">Untitled App</strong></div>
          <div class="preview-content"><div class="preview-card"><strong>Reusable block preview</strong><p>Forms and Records consume the same shared tokens.</p><button class="primary preview-button">Primary action</button></div></div>
        </div>
      </section>
    </div>
  </main>

  <script src="block.js"></script>
  <script>
    const api = new ShiaThemeBrand003.ThemeBrandBlock();
    const $ = (id) => document.getElementById(id);
    const fields = {
      name: $('brand-name'), logoUrl: $('logo-url'), primary: $('primary-color'), primaryPicker: $('primary-picker'),
      secondary: $('secondary-color'), secondaryPicker: $('secondary-picker'), font: $('font-family'),
      weight: $('heading-weight'), radius: $('radius'), buttonStyle: $('button-style'), density: $('density')
    };

    function formTheme() {
      return { type:'ThemeConfig', version:'1.0', brand:{ name:fields.name.value, logoUrl:fields.logoUrl.value, primaryColor:fields.primary.value, secondaryColor:fields.secondary.value }, typography:{ fontFamily:fields.font.value, headingWeight:Number(fields.weight.value) }, components:{ borderRadius:fields.radius.value, buttonStyle:fields.buttonStyle.value, density:fields.density.value } };
    }
    function render(theme) {
      fields.name.value=theme.brand.name; fields.logoUrl.value=theme.brand.logoUrl; fields.primary.value=theme.brand.primaryColor; fields.primaryPicker.value=theme.brand.primaryColor; fields.secondary.value=theme.brand.secondaryColor; fields.secondaryPicker.value=theme.brand.secondaryColor; fields.font.value=theme.typography.fontFamily; fields.weight.value=theme.typography.headingWeight; fields.radius.value=theme.components.borderRadius; fields.buttonStyle.value=theme.components.buttonStyle; fields.density.value=theme.components.density;
      $('preview-name').textContent=theme.brand.name;
      const logo=$('preview-logo'); logo.src=theme.brand.logoUrl; logo.style.display=theme.brand.logoUrl?'block':'none';
      ShiaThemeBrand003.applyTheme(theme);
    }
    function log(message, payload) { $('console').textContent = message + (payload ? '\n' + JSON.stringify(payload,null,2) : ''); }

    fields.primaryPicker.addEventListener('input', e => { fields.primary.value=e.target.value.toUpperCase(); render(ShiaThemeBrand003.normalizeTheme(formTheme())); });
    fields.secondaryPicker.addEventListener('input', e => { fields.secondary.value=e.target.value.toUpperCase(); render(ShiaThemeBrand003.normalizeTheme(formTheme())); });
    document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', () => render(ShiaThemeBrand003.normalizeTheme(formTheme()))));
    $('theme-form').addEventListener('submit', e => { e.preventDefault(); const result=api.loadTheme(formTheme()); if(result.ok){ render(result.theme); log('themeChanged emitted.',result.theme); } else log('Validation failed.',result.errors); });
    $('reset-button').addEventListener('click', () => { const theme=api.resetTheme(); render(theme); log('themeReset emitted.',theme); });
    window.addEventListener('message', event => { const message=event.data; if(!message || message.source!=='shia-factory') return; const result=api.handleInput(message.input,message.payload); log('Factory input received: '+message.input,result); if(result?.theme) render(result.theme); });
    api.addEventListener('validationError', e => log('validationError emitted.',e.detail));
    const initial=api.loadStored(); render(initial); log('Block initialized.',initial);
  </script>
</body>
</html>
